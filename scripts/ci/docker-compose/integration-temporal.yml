---
services:
  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.24
    labels:
      breeze.description: "Integration required for Temporal orchestrator tests."
    ports:
      - "${TEMPORAL_HOST_PORT}:7233"
    environment:
      - DB=sqlite
      - SKIP_SCHEMA_SETUP=false
      - TEMPORAL_ADDRESS=temporal:7233
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 30
    restart: "on-failure"
  airflow:
    environment:
      - INTEGRATION_TEMPORAL=true
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
