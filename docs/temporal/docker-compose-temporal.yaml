# Airflow with Temporal Orchestrator - Getting Started
#
# This docker-compose replaces Airflow's scheduler with Temporal for orchestration.
# DAG execution is handled by Temporal workflows instead of Airflow's scheduler.
#
# Components:
#   - temporal: Temporal server (workflow orchestration)
#   - postgres: Database for Airflow metadata (connections, variables, UI state)
#   - airflow-apiserver: Airflow UI and API
#   - airflow-dag-processor: Parses DAG files into serialized_dag table
#   - temporal-worker: Executes DAGs via Temporal workflows
#
# What's different from standard Airflow:
#   - No airflow-scheduler (Temporal handles orchestration)
#   - No celery workers (Temporal worker executes tasks)
#   - No redis (Temporal replaces the message broker)
#
# Usage:
#   docker-compose -f docker-compose-temporal.yaml up
#
# Access:
#   - Airflow UI: http://localhost:8080 (admin/airflow)
#   - Temporal UI: http://localhost:8233
#
---
x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.0}
  environment:
    &airflow-common-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    # Temporal configuration
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: default
    TEMPORAL_TASK_QUEUE: airflow-tasks
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/scripts:/opt/airflow/scripts
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    temporal:
      condition: service_healthy

services:
  # =============================================================================
  # Temporal Server
  # =============================================================================
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: temporal
    ports:
      - "7233:7233"   # gRPC API
      - "8233:8233"   # Web UI
    environment:
      - DB=sqlite
      - SKIP_SCHEMA_SETUP=false
      - TEMPORAL_ADDRESS=temporal:7233
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 30
    restart: always

  # =============================================================================
  # PostgreSQL for Airflow Metadata
  # =============================================================================
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # =============================================================================
  # Airflow Initialization
  # =============================================================================
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Creating directories..."
        mkdir -p /opt/airflow/{logs,dags,plugins,scripts}

        echo "Initializing Airflow database..."
        airflow db migrate

        echo "Creating admin user..."
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-airflow} \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-airflow} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

        echo "Airflow initialization complete!"
    environment:
      <<: *airflow-common-env
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy

  # =============================================================================
  # Airflow API Server (UI)
  # =============================================================================
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # =============================================================================
  # Airflow DAG Processor
  # Parses DAG files and stores serialized DAGs in database
  # =============================================================================
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # =============================================================================
  # Temporal Worker for Airflow DAG Execution
  # Runs deep integration workflow + activities
  # =============================================================================
  temporal-worker:
    <<: *airflow-common
    container_name: temporal-worker
    command: python /opt/airflow/scripts/temporal_airflow/deep_worker.py
    environment:
      <<: *airflow-common-env
      PYTHONPATH: /opt/airflow/scripts
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f deep_worker.py || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

  # =============================================================================
  # Airflow CLI (for debugging)
  # =============================================================================
  airflow-cli:
    <<: *airflow-common
    container_name: airflow-cli
    profiles:
      - debug
    command:
      - bash
      - -c
      - airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
